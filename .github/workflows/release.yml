name: Release binaries

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package Unix binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/release/tel" "dist/tel"
          tar -czf "tel-linux-x86_64.tar.gz" -C dist "tel"

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tel-linux-x86_64.tar.gz
          path: tel-linux-x86_64.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          short_sha="${RELEASE_SHA::7}"
          tag="main-${RELEASE_SHA}"
          title="tel ${short_sha}"
          notes="Automated release for main commit ${RELEASE_SHA}."
          mapfile -t files < <(find dist -type f | sort)

          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "No release assets found." >&2
            exit 1
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${files[@]}" --clobber
          else
            gh release create "${tag}" "${files[@]}" \
              --target "${RELEASE_SHA}" \
              --title "${title}" \
              --notes "${notes}"
          fi
