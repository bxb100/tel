name: Run tel task
description: Download the released tel binary and run task config TOML against a Telegram session.

inputs:
  task_data_url:
    description: URL to the task config TOML text.
    required: true
  session_path:
    description: Path to the grammers SQLite session file, or encrypted session file when decrypt_key is provided.
    required: true
  task_name:
    description: Optional task name to run. Empty runs all tasks.
    required: false
    default: ""
  decrypt_key:
    description: Optional GPG passphrase used to decrypt the encrypted session file.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Prepare environment
      shell: bash
      env:
        DECRYPT_KEY: ${{ inputs.decrypt_key }}
        TASK_DATA_URL: ${{ inputs.task_data_url }}
        ACTION_REPO: ${{ github.action_repository }}
        WORKFLOW_REPO: ${{ github.repository }}
        GH_TOKEN: ${{ github.token }}
        INPUT_SESSION: ${{ inputs.session_path }}
        TASK_NAME: ${{ inputs.task_name }}
      run: |
        if [[ -n "${DECRYPT_KEY}" ]]; then
          echo "::add-mask::${DECRYPT_KEY}"
          echo "GPG_DECRYPT_KEY=${DECRYPT_KEY}" >> "$GITHUB_ENV"
        fi
        cat >> "$GITHUB_ENV" <<EOF
        TASK_DATA_URL=${TASK_DATA_URL}
        ACTION_REPOSITORY=${ACTION_REPO}
        WORKFLOW_REPOSITORY=${WORKFLOW_REPO}
        GH_TOKEN=${GH_TOKEN}
        INPUT_SESSION_PATH=${INPUT_SESSION}
        TASK_NAME=${TASK_NAME}
        EOF

    - name: Write task config
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/write-task-config.sh"

    - name: Download release binary
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/download-release.sh"

    - name: Resolve session file
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/resolve-session.sh"

    - name: Run task
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/run-task.sh"

    - name: Persist encrypted session
      if: ${{ always() && inputs.decrypt_key != '' && env.DECRYPTED_SESSION_PATH != '' }}
      shell: bash
      run: "${GITHUB_ACTION_PATH}/scripts/persist-session.sh"
