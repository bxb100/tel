[package]
name = "tel"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.6.7", features = ["derive"] }
cron = "0.17.0"
futures = "0.3.34"
grammers-client = { git = "https://codeberg.org/Lonami/grammers.git", rev = "15b7afa46a9c6853aa9d8efc9d70a0f46b1781c3" }
grammers-session = { git = "https://codeberg.org/Lonami/grammers.git", rev = "8fb81354a35d1caa7fe4207f0db87c60670e1d15", default-features = false }
inquire = { version = "0.9.4", features = ["editor"] }
rand = "0.10.1"
regex-lite = "0.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.2.0"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
